name: iOS 构建 (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    concurrency:
      group: ios-build
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select Xcode 16.4
        run: |
          ls -1 /Applications | grep -i Xcode || true
          # 优先 Xcode 16.x；选 RN 0.76 兼容版本
          XC=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$XC" ]; then sudo xcode-select -switch "$XC"; fi
          xcodebuild -version
          node -v
          ruby -v
          pod --version || echo "no pod yet"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install JS dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --prefer-offline; else npm install --no-audit; fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Archive (CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/MusicFree.xcworkspace \
            -scheme MusicFree \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/MusicFree.xcarchive \
            -derivedDataPath $PWD/build/derived \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tail -100

      - name: Package unsigned IPA
        run: |
          set -e
          APP=$(find "$PWD/build/MusicFree.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n1)
          if [ -z "$APP" ]; then echo "::error::.app not found"; exit 1; fi
          mkdir -p "$PWD/build/Payload"
          cp -r "$APP" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -qr "MusicFree-ios-fade-unsigned.ipa" Payload
          ls -lh *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MusicFree-ios-fade-unsigned
          path: build/*.ipa
          retention-days: 14
          if-no-files-found: error